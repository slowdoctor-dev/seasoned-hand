services:
  # ===== LLM Gateway =====
  # Configured in Story 0.1
  bifrost:
    image: maximhq/bifrost:v1.5.0
    container_name: seasoned-hand-bifrost
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:8080"
    volumes:
      - ./bifrost/data:/app/data
      - ./bifrost/config.json:/app/data/config.json:ro
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - BIFROST_MODEL_PRIMARY=${BIFROST_MODEL_PRIMARY:-claude-sonnet-4-6}
      - BIFROST_MODEL_FALLBACK=${BIFROST_MODEL_FALLBACK:-gpt-4o}
      - BIFROST_MODEL_LOCAL_FAST=${BIFROST_MODEL_LOCAL_FAST:-llama3.2:3b}
      - BIFROST_ENCRYPTION_KEY=${BIFROST_ENCRYPTION_KEY:-seasoned-hand-phase0-local-dev-key}
      - APP_HOST=0.0.0.0
      - APP_PORT=8080
      - LOG_LEVEL=info
      - LOG_STYLE=json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ===== Redis (pub/sub + streams) =====
  # Configured in Phase 0
  redis:
    image: redis:7-alpine
    container_name: seasoned-hand-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes

  # ===== Control plane (Rust) =====
  # Built in Phase 0, story 0.2+
  # Uncomment when /src/Dockerfile exists
  # control-plane:
  #   build: .
  #   container_name: seasoned-hand-control-plane
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   env_file: .env
  #   depends_on:
  #     - bifrost
  #     - redis
  #   volumes:
  #     - ./data/db:/app/data
  #     - ./data/workspaces:/workspaces

  # ===== Frontend (Next.js) =====
  # Built in Phase 0, story 0.18+
  # frontend:
  #   build: ./frontend
  #   container_name: seasoned-hand-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "3001:3000"
  #   env_file: .env
  #   depends_on:
  #     - control-plane

  # ===== AIO Sandbox (per-session) =====
  # Created dynamically by control plane via bollard.
  # Not defined as a long-running service.

networks:
  default:
    name: seasoned-hand
