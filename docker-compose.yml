services:
  # ===== LLM Gateway =====
  # Configured in Story 0.1
  bifrost:
    image: maximhq/bifrost:v1.5.0
    container_name: seasoned-hand-bifrost
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:8080"
    volumes:
      - ./bifrost/data:/app/data
      - ./bifrost/config.json:/app/data/config.json:ro
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - BIFROST_MODEL_PRIMARY=${BIFROST_MODEL_PRIMARY:-claude-sonnet-4-6}
      - BIFROST_MODEL_FALLBACK=${BIFROST_MODEL_FALLBACK:-gpt-4o}
      - BIFROST_MODEL_LOCAL_FAST=${BIFROST_MODEL_LOCAL_FAST:-llama3.2:3b}
      - BIFROST_ENCRYPTION_KEY=${BIFROST_ENCRYPTION_KEY:-seasoned-hand-phase0-local-dev-key}
      - APP_HOST=0.0.0.0
      - APP_PORT=8080
      - LOG_LEVEL=info
      - LOG_STYLE=json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ===== Redis (pub/sub + streams) =====
  # Configured in Phase 0
  redis:
    image: redis:7-alpine
    container_name: seasoned-hand-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes

  # ===== Control plane (Rust) — serves /v1 + /ws + the Dioxus UI =====
  # One image (see ./Dockerfile): the Rust binary self-serves the built Dioxus
  # bundle via SH_UI_DIST (issue #33), so `docker compose up -d` brings up the
  # whole stack and the UI is at http://localhost:3000 (issue #6).
  control-plane:
    build: .
    container_name: seasoned-hand-control-plane
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    # The image ships safe defaults (HOST=0.0.0.0, SH_UI_DIST, REDIS_URL=redis://redis:6379);
    # .env supplies provider keys + any overrides. `env_file` is optional — compose
    # warns but starts if it's missing, so copy .env.example to .env first.
    env_file:
      - path: .env
        required: false
    environment:
      # Point the control plane at the in-compose Bifrost gateway (internal port).
      - BIFROST_BASE_URL=http://bifrost:8080/v1
    depends_on:
      - bifrost
      - redis
    volumes:
      # Persist the SQLite DB + per-session workspaces.
      - ./data/control-plane:/app/data
      # slots.yaml (model routing) is read at /app/config/slots.yaml if present.
      - ./config:/app/config:ro
      # Sandbox spawning (bollard) talks to the host Docker daemon. This grants the
      # control plane control of the host's Docker — see sandbox/mod.rs + SECURITY.md
      # for the trust boundary. Required only to EXECUTE tasks (sandbox per session);
      # the API/UI boot fine without it (SandboxClient connects lazily).
      - /var/run/docker.sock:/var/run/docker.sock

  # ===== AIO Sandbox (per-session) =====
  # Created dynamically by the control plane via bollard (host Docker socket above).
  # Not defined as a long-running service.

networks:
  default:
    name: seasoned-hand
