name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  spec-check:
    name: Spec compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run spec-check
        run: ./scripts/spec-check.sh

  rust:
    name: Rust (clippy, fmt, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings
      - name: Test
        run: cargo test --workspace

  ui:
    name: UI (Dioxus fmt, clippy, wasm check)
    runs-on: ubuntu-latest
    # The UI crate is excluded from the root workspace, so the `rust` job's
    # fmt/clippy/test do NOT cover it — this job is the canonical UI's only gate.
    defaults:
      run:
        working-directory: crates/seasoned-hand-ui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt -- --check
      - name: Clippy (wasm)
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - name: Compile-check the Dioxus UI for wasm
        run: cargo check --target wasm32-unknown-unknown

  ignored-tests:
    name: Ignored tests (workflow_dispatch only)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Pull pinned AIO sandbox image
        run: docker pull ghcr.io/agent-infra/sandbox:1.0.0.152
      - name: Run ignored Redis pubsub tests
        run: "cargo test --workspace -- --ignored pubsub::"
      - name: Run ignored live sandbox lifecycle test
        run: "cargo test --workspace -- --ignored sandbox::tests::live_create_inspect_destroy"
      - name: Start Bifrost (only when provider keys are set)
        if: ${{ env.ANTHROPIC_API_KEY != '' || env.OPENAI_API_KEY != '' }}
        run: |
          docker run -d --name seasoned-hand-bifrost-ci \
            -p 4000:8080 \
            -e ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY}" \
            -e OPENAI_API_KEY="${OPENAI_API_KEY}" \
            -e OLLAMA_BASE_URL="http://host.docker.internal:11434" \
            -e BIFROST_MODEL_PRIMARY="claude-sonnet-4-6" \
            -e BIFROST_MODEL_FALLBACK="gpt-4o" \
            -e BIFROST_MODEL_LOCAL_FAST="llama3.2:3b" \
            -e BIFROST_ENCRYPTION_KEY="seasoned-hand-phase0-ci-key" \
            -e APP_HOST="0.0.0.0" \
            -e APP_PORT="8080" \
            -e LOG_LEVEL="info" \
            -e LOG_STYLE="json" \
            -v "${{ github.workspace }}/bifrost/config.json:/app/data/config.json:ro" \
            --add-host host.docker.internal:host-gateway \
            maximhq/bifrost:v1.5.0
      - name: Wait for Bifrost health
        if: ${{ env.ANTHROPIC_API_KEY != '' || env.OPENAI_API_KEY != '' }}
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Bifrost did not become healthy in time" >&2
          exit 1
      - name: Run ignored Bifrost smoke test
        if: ${{ env.ANTHROPIC_API_KEY != '' || env.OPENAI_API_KEY != '' }}
        run: cargo test --workspace -- --ignored llm::tests::live_bifrost_chat_completion_smoke

  phase1-live-smoke:
    name: Phase 1 live smoke (workflow_dispatch only)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SEASONED_HAND_PHASE1_SMOKE: "1"
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Ensure required provider keys are present
        run: |
          test -n "${ANTHROPIC_API_KEY}" || (echo "missing ANTHROPIC_API_KEY secret" && exit 1)
          test -n "${OPENAI_API_KEY}" || (echo "missing OPENAI_API_KEY secret" && exit 1)
      - name: Pull pinned AIO sandbox image
        run: docker pull ghcr.io/agent-infra/sandbox:1.0.0.152
      - name: Start Bifrost
        run: |
          docker run -d --name seasoned-hand-bifrost-phase1-smoke \
            -p 4000:8080 \
            -e ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY}" \
            -e OPENAI_API_KEY="${OPENAI_API_KEY}" \
            -e OLLAMA_BASE_URL="http://host.docker.internal:11434" \
            -e BIFROST_MODEL_PRIMARY="claude-sonnet-4-6" \
            -e BIFROST_MODEL_FALLBACK="gpt-4o" \
            -e BIFROST_MODEL_LOCAL_FAST="llama3.2:3b" \
            -e BIFROST_ENCRYPTION_KEY="seasoned-hand-phase1-smoke-key" \
            -e APP_HOST="0.0.0.0" \
            -e APP_PORT="8080" \
            -e LOG_LEVEL="info" \
            -e LOG_STYLE="json" \
            -v "${{ github.workspace }}/bifrost/config.json:/app/data/config.json:ro" \
            --add-host host.docker.internal:host-gateway \
            maximhq/bifrost:v1.5.0
      - name: Wait for Bifrost health
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Bifrost did not become healthy in time" >&2
          exit 1
      - name: Run phase1 stable 50-step
        run: cargo test -p seasoned-hand-server --test phase1_stable_50step -- --nocapture
      - name: Run phase1 GAIA smoke
        env:
          SH_E2E_WS_URL: ws://127.0.0.1:3001/ws
        run: cargo test -p seasoned-hand-server --test phase1_gaia -- --ignored --nocapture

  phase2-live-overnight:
    name: Phase 2 live overnight (workflow_dispatch only)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SEASONED_HAND_PHASE2_SMOKE: "1"
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Ensure required provider keys are present
        run: |
          test -n "${ANTHROPIC_API_KEY}" || (echo "missing ANTHROPIC_API_KEY secret" && exit 1)
          test -n "${OPENAI_API_KEY}" || (echo "missing OPENAI_API_KEY secret" && exit 1)
      - name: Pull pinned AIO sandbox image
        run: docker pull ghcr.io/agent-infra/sandbox:1.0.0.152
      - name: Start Bifrost
        run: |
          docker run -d --name seasoned-hand-bifrost-phase2-overnight \
            -p 4000:8080 \
            -e ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY}" \
            -e OPENAI_API_KEY="${OPENAI_API_KEY}" \
            -e OLLAMA_BASE_URL="http://host.docker.internal:11434" \
            -e BIFROST_MODEL_PRIMARY="claude-sonnet-4-6" \
            -e BIFROST_MODEL_FALLBACK="gpt-4o" \
            -e BIFROST_MODEL_LOCAL_FAST="llama3.2:3b" \
            -e BIFROST_ENCRYPTION_KEY="seasoned-hand-phase2-overnight-key" \
            -e APP_HOST="0.0.0.0" \
            -e APP_PORT="8080" \
            -e LOG_LEVEL="info" \
            -e LOG_STYLE="json" \
            -v "${{ github.workspace }}/bifrost/config.json:/app/data/config.json:ro" \
            --add-host host.docker.internal:host-gateway \
            maximhq/bifrost:v1.5.0
      - name: Wait for Bifrost health
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Bifrost did not become healthy in time" >&2
          exit 1
      - name: Run phase2 live overnight smoke
        run: cargo test -p seasoned-hand-server --test phase2_live_overnight -- --ignored --nocapture

  phase2-live-webhook-roundtrip:
    name: Phase 2 live webhook → email roundtrip (workflow_dispatch only)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_PORT: ${{ secrets.IMAP_PORT }}
      IMAP_USERNAME: ${{ secrets.IMAP_USERNAME }}
      IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
      SEASONED_HAND_PHASE2_SMOKE: "1"
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Ensure required secrets are present
        run: |
          test -n "${ANTHROPIC_API_KEY}" || (echo "missing ANTHROPIC_API_KEY secret" && exit 1)
          test -n "${OPENAI_API_KEY}" || (echo "missing OPENAI_API_KEY secret" && exit 1)
          test -n "${SMTP_HOST}" || (echo "missing SMTP_HOST secret" && exit 1)
          test -n "${SMTP_USERNAME}" || (echo "missing SMTP_USERNAME secret" && exit 1)
          test -n "${SMTP_PASSWORD}" || (echo "missing SMTP_PASSWORD secret" && exit 1)
          test -n "${IMAP_HOST}" || (echo "missing IMAP_HOST secret" && exit 1)
          test -n "${IMAP_USERNAME}" || (echo "missing IMAP_USERNAME secret" && exit 1)
          test -n "${IMAP_PASSWORD}" || (echo "missing IMAP_PASSWORD secret" && exit 1)
      - name: Pull pinned AIO sandbox image
        run: docker pull ghcr.io/agent-infra/sandbox:1.0.0.152
      - name: Start Bifrost
        run: |
          docker run -d --name seasoned-hand-bifrost-phase2-webhook \
            -p 4000:8080 \
            -e ANTHROPIC_API_KEY="${ANTHROPIC_API_KEY}" \
            -e OPENAI_API_KEY="${OPENAI_API_KEY}" \
            -e OLLAMA_BASE_URL="http://host.docker.internal:11434" \
            -e BIFROST_MODEL_PRIMARY="claude-sonnet-4-6" \
            -e BIFROST_MODEL_FALLBACK="gpt-4o" \
            -e BIFROST_MODEL_LOCAL_FAST="llama3.2:3b" \
            -e BIFROST_ENCRYPTION_KEY="seasoned-hand-phase2-webhook-key" \
            -e APP_HOST="0.0.0.0" \
            -e APP_PORT="8080" \
            -e LOG_LEVEL="info" \
            -e LOG_STYLE="json" \
            -v "${{ github.workspace }}/bifrost/config.json:/app/data/config.json:ro" \
            --add-host host.docker.internal:host-gateway \
            maximhq/bifrost:v1.5.0
      - name: Wait for Bifrost health
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Bifrost did not become healthy in time" >&2
          exit 1
      - name: Run phase2 webhook → email roundtrip
        run: cargo test -p seasoned-hand-server --test phase2_webhook_roundtrip -- --ignored --nocapture

  markdown-lint:
    name: Markdown (specs and docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            specs/**/*.md
            docs/**/*.md
            *.md
        continue-on-error: true
