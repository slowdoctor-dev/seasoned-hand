# Shared, wasm-safe data shapes (ADR-016 / Phase 6 story 6.3).
#
# Pure serde DTOs that cross the `/v1` + `/ws` boundary, depended on by BOTH the
# native backend (`seasoned-hand-core`) and the wasm frontend
# (`seasoned-hand-ui`). NO I/O dependencies (no rusqlite/tokio/bollard) so it
# compiles for both the host and `wasm32-unknown-unknown`.
[package]
name = "seasoned-hand-dto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
