[package]
name = "seasoned-hand-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
seasoned-hand-core = { path = "../seasoned-hand-core" }
seasoned-hand-dto = { path = "../seasoned-hand-dto" }
axum = { workspace = true, features = ["ws"] }
# Issue #33: ServeDir/ServeFile to serve the built Dioxus UI bundle (opt-in via
# SH_UI_DIST) so the control plane can self-host the UI as a single binary.
# Issue #22: `timeout` adds the global request TimeoutLayer in `app()`.
tower-http = { version = "0.6", features = ["fs", "timeout"] }
tokio = { workspace = true }
tokio-util = "0.7"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }
dashmap = "6"
# Story 2.10: constant-time webhook intake-token compare + CIDR allow-list.
subtle = "2"
ipnet = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { workspace = true }
wiremock = "0.6"
tokio-tungstenite = "0.24"
tower = "0.5"
tempfile = "3"
# Story 2.25: inspect raw bytes of captured outbound mail in phase2_overnight.rs.
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }
async-trait = "0.1"
