[application]
name = "seasoned-hand-ui"
default_platform = "web"

[web.app]
title = "Seasoned Hand"

[web.watcher]
reload_html = true
watch_path = ["src", "index.html", "input.css"]

[web.resource]
style = ["assets/tailwind.css"]
script = []

# dioxus-cli 0.6.x requires the `dev`-only resource subtable to be present even
# when empty (the field is non-optional in WebResourceConfig). These are the
# extra stylesheets/scripts injected only under `dx serve` (dev), not `dx build`.
[web.resource.dev]
style = []
script = []
