[package]
name = "seasoned-hand-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
seasoned-hand-dto = { path = "../seasoned-hand-dto" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
rusqlite = { version = "0.31", features = ["bundled", "serde_json"] }
refinery = { version = "0.8", features = ["rusqlite"] }
deadpool-redis = "0.15"
futures-util = "0.3"
async-trait = "0.1"
bollard = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
serde_yaml = "0.9"
tiktoken-rs = "0.5"
sha2 = "0.10"
bytes = "1"
tokio-util = "0.7"
dashmap = "6"
# Story 2.10: SSRF allow-list parsing (CIDR) for WebhookChannel.
ipnet = "2"
# Story 2.10: constant-time intake-token compare for WebhookChannel.
subtle = "2"
# Story 2.11: EmailChannel — IMAP poller (intake) + lettre SMTP (delivery + notify) + mailparse (RFC 5322).
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }
mailparse = "0.15"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
# Story 2.11: TLS for the IMAP poller (matches reqwest rustls-tls; no openssl).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = "0.26"
# Story 2.11: futures combinators for the async-imap fetch stream drain.
futures = "0.3"
# Story 2.11: sender allow-list regex matching for EmailChannel.
regex = "1"
# Story 2.12: config/notify.toml parser for NotifyWorker per-trigger routing.
toml = "0.8"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
wiremock = "0.6"
