[workspace]
resolver = "2"
members = [
    "crates/seasoned-hand-core",
    "crates/seasoned-hand-server",
    "crates/seasoned-hand-cli",
]
# The Dioxus frontend (ADR-016) targets wasm32 only and pulls wasm-bindgen /
# web-sys, which do not compile for the native host target. Excluding it keeps
# the backend gates (`cargo clippy --all-targets`, `cargo test --workspace`)
# native-only and green. Build the UI with `cargo build -p seasoned-hand-ui
# --target wasm32-unknown-unknown` (or `dx build`) from crates/seasoned-hand-ui.
# Follow-up (Phase 6 story): extract a wasm-safe `seasoned-hand-dto` workspace
# member so the UI shares DTOs with core instead of mirroring them.
exclude = [
    "crates/seasoned-hand-ui",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["Seasoned Hand contributors"]
repository = "https://github.com/slowdoctor-dev/seasoned-hand"

[workspace.dependencies]
axum = "0.7"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
